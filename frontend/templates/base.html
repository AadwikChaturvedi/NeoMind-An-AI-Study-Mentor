<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}NeoMind AI{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0B0E1A',
          surface: '#12162A',
          elevated: '#1B2140',
          hairline: '#262C4A',
          violet: '#7C6CFF',
          cyan: '#4CC9F0',
          amber: '#F5A623',
          coral: '#FF6B6B',
          ink2: '#8B90AC',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      }
    }
  }
</script>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-ink text-[#EDEEF7] font-sans antialiased">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full lg:translate-x-0 transition-transform duration-200 bg-surface border-r border-hairline flex flex-col">
    <div class="h-20 flex items-center gap-3 px-6 border-b border-hairline">
      <div class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="font-display text-xl tracking-tight">NeoMind<span class="text-violet">.</span></span>
    </div>

    <nav class="flex-1 px-3 py-6 space-y-1">
      <a href="/" class="nav-link {% if active == 'dashboard' %}nav-link-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/timer" class="nav-link {% if active == 'timer' %}nav-link-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>Study Timer</span>
      </a>
      <a href="/mentor" class="nav-link {% if active == 'mentor' %}nav-link-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>AI Mentor</span>
      </a>
      <a href="/analytics" class="nav-link {% if active == 'analytics' %}nav-link-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
        <span>Analytics</span>
      </a>
      <a href="/reports" class="nav-link {% if active == 'reports' %}nav-link-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
        <span>Reports</span>
      </a>
    </nav>

    <div class="p-4 border-t border-hairline">
      <div class="flex items-center gap-3 rounded-xl bg-elevated px-3 py-3">
        <div class="h-9 w-9 rounded-full bg-gradient-to-br from-violet to-cyan flex items-center justify-center font-mono text-xs font-semibold text-ink">AK</div>
        <div class="leading-tight">
          <p class="text-sm font-medium">Aadwik</p>
          <p class="text-xs text-ink2">Free plan</p>
        </div>
      </div>
    </div>
  </aside>

  <button id="sidebar-toggle" class="lg:hidden fixed top-4 left-4 z-50 h-10 w-10 rounded-lg bg-surface border border-hairline flex items-center justify-center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/60 z-30 lg:hidden"></div>

  <div class="flex-1 lg:pl-64 flex flex-col min-h-screen">
    <header class="h-20 flex items-center justify-between px-6 lg:px-10 border-b border-hairline sticky top-0 bg-ink/80 backdrop-blur z-20">
      <div class="pl-12 lg:pl-0">
        <p class="text-xs uppercase tracking-widest text-ink2">{% block eyebrow %}{% endblock %}</p>
        <h1 class="font-display text-2xl">{% block page_title %}{% endblock %}</h1>
      </div>
      <div id="live-pill" class="hidden items-center gap-2 rounded-full border border-violet/40 bg-violet/10 px-3 py-1.5 text-xs text-violet">
        <span class="h-1.5 w-1.5 rounded-full bg-violet animate-pulse"></span>
        Session live
      </div>
    </header>

    <main class="flex-1 px-6 lg:px-10 py-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  function openSidebar() { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); }
  function closeSidebar() { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
  sidebarToggle?.addEventListener('click', () => sidebar.classList.contains('-translate-x-full') ? openSidebar() : closeSidebar());
  overlay?.addEventListener('click', closeSidebar);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
